name: Publish NuGet and GitHub Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version (for example, 1.1.8 or 1.2.0-beta.1)
        required: true
        type: string

concurrency:
  group: nuget-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish ZXingBlazor ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PROJECT_FILE: src/ZXingBlazor/ZXingBlazor.csproj
      VERSION: ${{ inputs.version }}

    steps:
      - name: Check out master
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Version '$VERSION' is not a supported semantic version."
            exit 1
          fi

          current_version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$PROJECT_FILE")"
          if [[ -z "$current_version" ]]; then
            echo "::error::Could not read <Version> from $PROJECT_FILE."
            exit 1
          fi

          tag_exists=false
          if git rev-parse --verify --quiet "refs/tags/$VERSION" >/dev/null; then
            tag_exists=true
          fi

          if [[ "$current_version" == "$VERSION" && "$tag_exists" == true ]]; then
            echo "RESUME_RELEASE=true" >> "$GITHUB_ENV"
            echo "::notice::Resuming release $VERSION from its existing commit and tag."
          elif [[ "$current_version" == "$VERSION" ]]; then
            echo "::error::Version $VERSION is already set but its release tag is missing."
            exit 1
          elif [[ "$tag_exists" == true ]]; then
            echo "::error::Tag $VERSION already exists."
            exit 1
          else
            echo "RESUME_RELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Update project version
        if: env.RESUME_RELEASE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sed -i -E "s#<Version>[^<]+</Version>#<Version>${VERSION}</Version>#" "$PROJECT_FILE"
          grep -q "<Version>${VERSION}</Version>" "$PROJECT_FILE"
          git diff --check
          if git diff --exit-code --quiet -- "$PROJECT_FILE"; then
            echo "::error::The project version was not changed."
            exit 1
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore "$PROJECT_FILE"

      - name: Build
        run: >
          dotnet build "$PROJECT_FILE"
          --configuration Release
          --no-restore
          -p:ContinuousIntegrationBuild=true

      - name: Pack
        run: >
          dotnet pack "$PROJECT_FILE"
          --configuration Release
          --no-build
          --output artifacts
          -p:ContinuousIntegrationBuild=true

      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail
          package="artifacts/ZXingBlazor.${VERSION}.nupkg"
          if [[ ! -f "$package" ]]; then
            echo "::error::Expected package $package was not created."
            find artifacts -maxdepth 1 -type f -print
            exit 1
          fi

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ZXingBlazor-${{ inputs.version }}
          path: artifacts/ZXingBlazor.${{ inputs.version }}.nupkg
          if-no-files-found: error

      - name: Prepare release commit and tag
        if: env.RESUME_RELEASE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PROJECT_FILE"
          git commit -m "Release ${VERSION}"
          git tag -a "$VERSION" -m "Release ${VERSION}"

      - name: Log in to NuGet with trusted publishing
        id: nuget_login
        uses: NuGet/login@v1.2.0
        with:
          user: alex_zou

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "artifacts/ZXingBlazor.${VERSION}.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Push release commit and tag
        if: env.RESUME_RELEASE != 'true'
        shell: bash
        run: git push --atomic origin HEAD:master "refs/tags/${VERSION}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          package="artifacts/ZXingBlazor.${VERSION}.nupkg"

          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$package" --clobber
            exit 0
          fi

          release_args=(
            "$VERSION"
            "$package"
            --verify-tag
            --generate-notes
            --title "ZXingBlazor ${VERSION}"
          )
          if [[ "$VERSION" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"
